name: Verify release candidate
on:
  push:
    branches: [release/v0.2.0]
permissions:
  contents: read
concurrency:
  group: release-v020
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository_owner == 'danial-maqbool'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.13'
      - run: python scripts/materialize.py
      - run: python -m pip install black==25.1.0
      - run: python -m black app localdesk tests scripts run.py bootstrap.py
      - run: python scripts/materialize.py --refresh
      - id: source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Format and verify self-contained release source'
            git push origin HEAD:refs/heads/release/v0.2.0
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  test:
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr ffmpeg
      - run: python -m pip install -r requirements-dev.txt
      - if: runner.os == 'Linux'
        run: python scripts/verify.py --strict
      - if: runner.os != 'Linux'
        run: python scripts/verify.py
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: platform-${{ matrix.os }}-${{ matrix.python }}
          path: docs/test-report.json
  evidence:
    needs: [prepare, test]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.13'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr ffmpeg xvfb xauth python3-tk scrot gnome-screenshot
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip_audit -r requirements.txt -f json -o docs/dependency-audit.json
      - run: python scripts/verify.py --strict
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/browser_check.py --record
      - name: Real desktop checks
        shell: bash
        run: |
          if [ -f scripts/desktop_check.py ]; then
            xvfb-run -a python scripts/desktop_check.py > docs/desktop-report.json
          fi
          if [ -f scripts/activity_check.py ]; then
            xvfb-run -a python scripts/activity_check.py > docs/activity-report.json
          fi
          if [ -f scripts/worker_check.py ]; then
            python scripts/worker_check.py
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: platform-*
          path: docs/platforms
      - name: Record verified release evidence
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs
          git commit -m 'Record browser demos and verified release evidence'
          git push origin HEAD:refs/heads/release/v0.2.0
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: release-evidence
          path: |
            docs/test-report.json
            docs/browser-report.json
            docs/dependency-audit.json
            docs/*-report.json
            docs/assets
