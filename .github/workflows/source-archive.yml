name: Source archive
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/source-archive.yml'
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Archive tracked source and release evidence
        run: |
          git archive --format=zip --output=source.zip HEAD
          git rev-parse HEAD > source-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tracked-source
          path: |
            source.zip
            source-commit.txt
          retention-days: 7
